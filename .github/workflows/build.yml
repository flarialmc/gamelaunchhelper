name: Build
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps: 
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify
        shell: pwsh
        run: |
          $Message = "${{ github.event.head_commit.message }}"
          
          if ($Message -notlike 'release:*') 
          { 
              Write-Host "Not a release commit, cancelling."
              gh run cancel "${{ github.run_id }}"
              gh run watch "${{ github.run_id }}"
              exit 0 
          }

          Write-Host "A release commit, proceeding."

      - name: MSYS2
        uses: msys2/setup-msys2@v2
        with: 
          update: true
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build
        env:
          MSYSTEM: UCRT64
        shell: msys2 {0}
        run: |
          ./Build.cmd

      - name: Token
        uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: flarialmc
          repositories: newcdn

      - name: CDN
        uses: actions/checkout@v7
        with:
          repository: 'flarialmc/newcdn'
          ref: 'main'
          path: 'cdn'
          token: ${{ steps.token.outputs.token }}

      - name: Deploy
        shell: pwsh
          $Path = "$(Get-Location)\src\bin\gamelaunchhelper.dll"
          Move-Item "$Path" "cdn\launcher\gamelaunchhelper.dll"

          Set-Location "cdn"

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@example.com"

          git add "launcher\gamelaunchhelper.dll"
          git commit -m "Update Game Launch Helper"
          git push
